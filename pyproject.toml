[project]
name = "qbox"
version = "0.1.0"
description = "PINN vs classical split-operator solver for the 2D Schrodinger equation"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "scipy",
    "torch",
    "matplotlib",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.10.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qbox"]
